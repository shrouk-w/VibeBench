[project]
name = "vibebench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1,<8",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
